# ---- Simple Player keys ----
# format:  KEY  command
# "script-message sp-..." commands are handled by scripts/simple-player.lua

SPACE        cycle pause
RIGHT        seek 5
LEFT         seek -5
UP           script-message sp-volume 5
DOWN         script-message sp-volume -5
WHEEL_UP     script-message sp-wheel 5
WHEEL_DOWN   script-message sp-wheel -5
ENTER        script-message sp-enter
KP_ENTER     script-message sp-enter
ESC          script-message sp-escape

f            frame-step
F            frame-step
b            frame-back-step
B            frame-back-step

# subtitles
.            script-message sp-sub-delay 0.5
,            script-message sp-sub-delay -0.5
Shift+UP     script-message sp-sub-font 3
Shift+DOWN   script-message sp-sub-font -3
Alt+UP       script-message sp-sub-pos -2
Alt+DOWN     script-message sp-sub-pos 2
Shift+RIGHT  script-message sp-sub-border 1
Shift+LEFT   script-message sp-sub-border -1
c            script-message sp-sub-color
C            script-message sp-sub-color
h            script-message sp-sub-shade
H            script-message sp-sub-shade
s            script-message sp-load-sub
S            script-message sp-load-sub

# misc
a            script-message sp-size-cycle
A            script-message sp-size-cycle
m            script-message sp-mute
M            script-message sp-mute
o            script-message sp-open-video
O            script-message sp-open-video
l            script-message sp-list
L            script-message sp-list
r            script-message sp-resume
R            script-message sp-resume