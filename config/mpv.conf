# ---- Simple Player settings ----

# window: opens maximized (almost like full screen), title bar kept
window-maximized=yes
force-window=yes
idle=yes
keep-open=yes
title=${?media-title:${media-title} - }Simple Player
cursor-autohide=no

# we draw our own UI (see scripts/simple-player.lua)
osc=no
osd-bar=no
osd-level=0
input-default-bindings=no

# remember where you stopped
save-position-on-quit=yes

# volume
volume=100
volume-max=100

# subtitles (size, color, position, shade are controlled by the script)
sub-auto=fuzzy
sub-font="Segoe UI"
sub-bold=yes
slang=en,eng

# video
hwdec=no

# If playback stutters on a slow CPU, remove the # from these two lines:
#profile=fast
#vd-lavc-skiploopfilter=nonref
